<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <meta name="description" content="普通の数字の15パズルと、番号の見えない手がかりモード（ずれ・ビット・合計）で遊べるスライドパズル。">
  <title>D-SLIDE — 15パズル（スライドパズル）</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="D-SLIDE">
  <meta property="og:title" content="D-SLIDE — 15パズル（スライドパズル）">
  <meta property="og:description" content="普通の数字の15パズルと、番号の見えない手がかりモード（ずれ・ビット・合計）で遊べるスライドパズル。">
  <meta property="og:url" content="https://t-of.github.io/d-slide/">
  <meta property="og:image" content="https://t-of.github.io/d-slide/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="D-SLIDE">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!-- タイトル -->
  <main class="screen title" id="title">
    <header class="title__head">
      <h1 class="title__name">D<span class="title__dash">-</span>SLIDE</h1>
      <p class="title__catch">15-PUZZLE / 手がかりで解く</p>
      <p class="title__rule">列・行を押してすべらせ、番号どおりに並べる</p>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="モード"></nav>

    <section class="preview" id="preview">
      <span class="board board--mini preview__board" id="preview-board" aria-hidden="true"></span>
      <div class="preview__text">
        <p class="preview__head"><span class="preview__name" id="preview-name"></span><span class="preview__level" id="preview-level"></span></p>
        <p class="preview__desc" id="preview-desc"></p>
        <p class="preview__record" id="preview-record"></p>
      </div>
    </section>

    <button class="start" id="start-btn">START</button>

    <footer class="foot">
      <div class="foot__actions">
        <button class="pill" id="sound-btn" aria-pressed="true">音 オン</button>
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
      <p class="credit"><a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a></p>
    </footer>
  </main>

  <!-- 遊ぶ -->
  <main class="screen play" id="play" hidden>
    <header class="hud">
      <button class="hud__back" id="back-btn" aria-label="もどる">‹</button>
      <span class="hud__mode" id="mode-name"></span>
      <span class="hud__stat">手数<b id="moves">0</b></span>
      <span class="hud__stat hud__stat--best" id="hud-min">BEST<b id="min">0</b></span>
    </header>

    <section class="stage" id="stage">
      <div class="hints" id="clue-row">
        <span class="hints__count" id="count">正しい場所 <b id="correct">0</b>/15</span>
        <div class="hints__goal" id="bit-goal">
          <span><b id="bit-goal-digit">8</b> の桁</span>
          <span class="board board--mini" id="bit-goal-board" aria-hidden="true"></span>
        </div>
      </div>

      <div class="puzzle" id="puzzle">
        <div class="sums sums--cols" id="col-sums"></div>
        <div class="sums sums--rows" id="row-sums"></div>
        <div class="board" id="board"></div>
      </div>

      <div class="digits" id="digits" role="group" aria-label="見る桁"></div>
    </section>

    <footer class="tools">
      <button class="tool" id="reset-btn"><span class="tool__ico" aria-hidden="true">↺</span>はじめから</button>
      <button class="tool" id="another-btn"><span class="tool__ico" aria-hidden="true">⇄</span>べつの盤</button>
    </footer>

    <!-- クリア（盤の上に下寄せで重ねる） -->
    <section class="clear" id="clear" hidden>
      <div class="clear__card" role="dialog" aria-labelledby="clear-title">
        <h2 class="clear__title" id="clear-title">CLEAR</h2>
        <p class="clear__moves"><span id="clear-moves">0</span><small>手</small></p>
        <p class="clear__best" id="clear-best"></p>
        <p class="clear__badges" id="badges" hidden><span class="badge">記録更新</span></p>
        <button class="btn btn--main" id="again-btn">もう一度</button>
        <div class="clear__row">
          <button class="btn" id="share-btn">共有</button>
          <button class="btn" id="home-btn">タイトルへ</button>
        </div>
      </div>
    </section>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script type="module" src="./main.js"></script>
</body>
</html>
